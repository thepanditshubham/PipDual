# Gitleaks configuration.
#
# The default rules are kept; the only allowlist entry is the public stablecoin
# contract address used by the EVM deposit readers. A contract address is not a
# credential, but it is a 40-hex string that the generic-api-key heuristic
# flags. The allowlist is scoped to that file and that exact shape so a real
# key in the same file would still be reported.

[extend]
useDefault = true

[allowlist]
description = "Public USDT contract addresses in the chain reader config"
condition = "AND"
regexTarget = "match"
paths = ['''src/lib/economy/etherscan\.ts''']
regexes = ['''0x[0-9a-fA-F]{40}''']
